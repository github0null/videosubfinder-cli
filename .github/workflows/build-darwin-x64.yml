name: Build Darwin X64

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  buildx:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Assign release version
        run: |
          release_version="$(sed -nE 's/.*VSF_VERSION[[:space:]]+"([^"]+)".*/\1/p' Interfaces/VideoSubFinderWXW/MyResource.h | head -1)"
          echo "release_version=${release_version}" >> "$GITHUB_ENV"

      - name: Empty Homebrew downloads cache
        run: rm -rfv ~/Library/Caches/Homebrew/downloads/* || true

      - name: Restore Homebrew cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads/
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build-darwin-x64.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake wxwidgets@3.2 opencv@4 ffmpeg tbb

      - name: Save Homebrew cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads/
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build-darwin-x64.yml') }}

      - name: Build
        run: |
          alias nproc="sysctl -n hw.logicalcpu"
          cd Build
          cmake -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=OFF -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DLIBCXX_ENABLE_PARALLEL_ALGORITHMS=YES \
            -DFFMPEG_INCLUDE_DIRS="$(readlink -f /usr/local/Cellar/ffmpeg/6*/include 2>/dev/null || readlink -f /opt/homebrew/opt/ffmpeg/include)" \
            -DPSTL_PARALLEL_BACKEND="tbb" \
            -DCMAKE_CXX_FLAGS="-isystem $(readlink -f /usr/local/Cellar/tbb/2*/include 2>/dev/null || readlink -f /opt/homebrew/opt/tbb/include)" \
            ..
          make VERBOSE=1 -j"$(sysctl -n hw.logicalcpu)"

      - name: Copy dependencies
        run: |
          cd Build && \
          mkdir work && \
          mkdir work/lib && \
          cd work && \
          otool -l ../Interfaces/VideoSubFinderCli/VideoSubFinderCli && \
          cp -fv /usr/local/lib/libwx_baseu-3.?.?.?.?.dylib lib/ 2>/dev/null || cp -fv /opt/homebrew/lib/libwx_baseu-3.*.dylib lib/ || true; \
          cp -fv /usr/local/lib/libopencv_videoio.*.dylib lib/ 2>/dev/null || cp -fv /opt/homebrew/lib/libopencv_videoio.*.dylib lib/ || true; \
          for lib in libavcodec libavformat libavutil libswscale libavfilter libtbb \
                     libopencv_imgcodecs libopencv_imgproc libopencv_core; do \
            cp -fv /usr/local/lib/${lib}.*.dylib lib/ 2>/dev/null || cp -fv /opt/homebrew/lib/${lib}.*.dylib lib/ || true; \
          done; \
          cp -fv ../Interfaces/VideoSubFinderCli/VideoSubFinderCli . && \
          cp -rfv ../Darwin_x64/* . && \
          mkdir ./settings && \
          cp -rf ../../Settings/general.cfg ./settings/ && \
          true

      - name: Archive artifacts
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'tar'
          filename: 'videosubfinder-cli-darwin-x64.tar.gz'
          directory: 'Build/work'
          path: "./*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videosubfinder-cli-darwin-x64
          path: ./Build/work/videosubfinder-cli-darwin-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Release draft
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "${{ env.release_version }}"
          tag_name: "${{ env.release_version }}-ci"
          files: |
            ./Build/work/videosubfinder-cli-darwin-x64.tar.gz
          body: "[Github Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
